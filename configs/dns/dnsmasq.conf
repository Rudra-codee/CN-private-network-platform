# dnsmasq configuration for Private DNS Server (Mac 1)
#
# This file contains the active dnsmasq configuration used on Mac 1
# (10.7.17.222) for the Private Network Service Platform.
#
# Software: dnsmasq 2.93
# Host: Mac 1 — 10.7.17.222
# Port: 53/UDP
#
# DNS clients configured to use this server:
#   - Mac 2 (10.7.9.11)
#   - Mac 4 (10.7.11.88)

# ─── Listener Configuration ─────────────────────────────────────────────────
# Bind dnsmasq to Mac 1's LAN IP address only.
# This ensures DNS queries are served exclusively on the private LAN interface,
# rather than on all available interfaces (including loopback).
listen-address=10.7.17.222

# Use bind-interfaces instead of wildcard binding.
# This prevents dnsmasq from binding to 0.0.0.0 and restricts it to the
# address(es) specified by listen-address. Required when other DNS processes
# may be running on the same host.
bind-interfaces

# Listen on the standard DNS port (53/UDP).
port=53

# ─── Authoritative Domain Records ───────────────────────────────────────────
# These A records define the private domains used by the project.
# Both domains resolve to Mac 2 (10.7.9.11), which serves as the
# edge reverse proxy and load balancer (nginx).

# Application domain — client-facing entry point
address=/app.teamX.test/10.7.9.11

# API domain — backend API entry point
address=/api.teamX.test/10.7.9.11

# ─── Upstream Forwarding ────────────────────────────────────────────────────
# For any domain NOT matched by the local records above, forward the query
# to the LAN gateway (10.7.0.1) for external resolution.
server=10.7.0.1

# Do not read /etc/resolv.conf for upstream DNS servers.
# This prevents dnsmasq from inheriting system-configured resolvers,
# ensuring all forwarding goes exclusively through the server= directive.
no-resolv

# ─── Query Filtering ────────────────────────────────────────────────────────
# Do not forward queries for unqualified hostnames (names without a dot).
# These are local-only names and should not leak to upstream resolvers.
domain-needed

# Do not forward reverse lookups for private IP ranges (RFC 1918).
# Queries like 10.x.x.x, 172.16.x.x, and 192.168.x.x PTR lookups
# are answered locally (NXDOMAIN) rather than sent upstream.
bogus-priv
